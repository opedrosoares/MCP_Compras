[project]
name = "compras-mcp"
version = "0.3.15"
description = "MCP server unificando APIs públicas do Compras.gov.br (Dados Abertos, PNCP e Portal da Transparência) para apoio a ETP, TR e demais documentos de contratação pela Lei 14.133/2021."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pedro Soares", email = "pedrohsoares.adv@gmail.com" },
]
keywords = ["mcp", "compras", "compras-gov-br", "licitacao", "pncp", "lei-14133", "etp", "brasil"]

dependencies = [
    "fastmcp>=2.0,<3.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.scripts]
compras-mcp = "compras_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compras_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
