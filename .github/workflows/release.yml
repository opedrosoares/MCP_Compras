name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build compras.mcpb
        run: python3 build_mcpb.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/compras.mcpb
          generate_release_notes: true
